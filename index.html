<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="validatePassword.js" defer></script>
    <title>Odin Sign-Up Form</title>
  </head>
  <body>
    <div class="signup-container">
      <aside class="brand-section">
        <div class="logo-div">
          <img src="assets/images/odin-lined.png" alt="odin logo">
          <span>ODIN</span>
        </div>
      </aside>
      <section class="form-section">
        <div class="container">
          <header class="sign-up-header">
            <h1 class="disclaimer-heading">
              This is not a real online service! You know you need something
              like this in your life to help you realize your deepest dreams.
              Sign up
              <em>now</em> to get started
            </h1>
            <p>You <i>Know</i> you want to.</p>
          </header>
        </div>
        <div>
          <form action="#" method="post">
            <h2 class="form-header">Let's do this!</h2>
            <div class="input-wrapper">
              <div>
                <label for="first-name">first name</label>
                <input id="first-name" type="text" required/>
              </div>
              <div>
                <label for="last-name">last name</label
                ><input id="last-name" type="text" required/>
              </div>
              <div>
                <label for="email">email</label>
                <input id="email" type="email" placeholder="example@test.com" required/>
              </div>
              <div>
                <label for="phone-number">phone number</label>
                <input id="phone-number" type="number" required/>
              </div>
              <div>
                <label for="password">password</label>
                <input id="password" type="password" required/>
              </div>
              <div>
                <label for="confirm-password">confirm password</label>
                <input id="confirm-password" type="password" required/>
              </div>
            </div>
            <div>
              <button id="form-submit" type="submit">Create Account</button>
            </div>

            <div><p class="login-paragraph">Already have an account? <a href="#">LOGIN</a></p></div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
